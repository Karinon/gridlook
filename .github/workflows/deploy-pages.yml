name: Deploy to GitHub Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to version subdirectory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ github.ref_name }}
          keep_files: true

      - name: Deploy latest to root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: latest
          keep_files: true

      - name: Generate index page
        run: |
          mkdir -p _site_root
          git fetch origin gh-pages:gh-pages || true
          VERSIONS=$(git ls-tree --name-only gh-pages | grep '^v' | sort -Vr)
          cat > _site_root/index.html << 'HEADER'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gridlook - Versions</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 600px; margin: 4rem auto; padding: 0 1rem; }
              h1 { margin-bottom: 0.5rem; }
              ul { list-style: none; padding: 0; }
              li { margin: 0.5rem 0; }
              a { color: #0969da; text-decoration: none; font-size: 1.1rem; }
              a:hover { text-decoration: underline; }
              .latest { font-weight: bold; }
            </style>
          </head>
          <body>
            <h1>Gridlook</h1>
            <p><a href="latest/" class="latest">Latest version</a></p>
            <h2>All versions</h2>
            <ul>
          HEADER
          for v in $VERSIONS; do
            echo "      <li><a href=\"${v}/\">${v}</a></li>" >> _site_root/index.html
          done
          cat >> _site_root/index.html << 'FOOTER'
            </ul>
          </body>
          </html>
          FOOTER

      - name: Deploy index
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site_root
          keep_files: true
